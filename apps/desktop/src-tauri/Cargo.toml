[package]
name = "taskboard-desktop"
version = "0.1.0"
description = "Taskboard desktop read-only proof of concept"
authors = ["Taskboard contributors"]
edition = "2021"

[lib]
name = "taskboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
