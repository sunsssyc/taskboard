[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskboard"
version = "0.1.0"
description = "跨项目任务看板:CLI 更新进度,本地服务或静态 HTML 查看"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
board = "taskboard.cli:main"

[tool.setuptools]
packages = ["taskboard"]

[tool.setuptools.package-data]
taskboard = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
